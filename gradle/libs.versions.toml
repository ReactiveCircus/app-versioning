[versions]
kotlin = "2.4.21"
agp = "9.5.0"
detekt = "2.0.0-alpha.6"
mavenPublish = "0.37.0"
burst = "2.14.0"
testkit = "0.21"
toolchainsResolver = "1.0.0"

[libraries]
agp-build-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
detektKtlintWrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
burst = { module = "app.cash.burst:burst", version.ref = "burst" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-gradle-samWithReceiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
burst = { id = "app.cash.burst", version.ref = "burst" }
testkit = { id = "com.autonomousapps.testkit", version.ref = "testkit" }
